<!DOCTYPE html>
<html lang="en">

<head>
    <title>MuJoCo Reachy Mini</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no, shrink-to-fit=0">
    <meta name="theme-color" content="#1a202c">
    <!-- <link rel="icon" type="image/x-icon" href="./assets/favicon.png"> -->

    <!-- Google Fonts for Tech Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400&display=swap"
        rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #1a202c;
            /* Match Sim Background roughly */
            overflow: hidden;
            font-family: 'Roboto Mono', monospace;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Ensure canvas is at base level */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            /* Lowest level, but ensures positioning */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            /* Above canvas */
            pointer-events: none !important;
            /* CRITICAL: Pass clicks through */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.6) 100%);
        }

        /* Ensure all children also pass events through unless explicitly interactive */
        #ui-layer * {
            pointer-events: none !important;
        }

        .header {
            display: flex;
            justify-content: space-between;
        }

        .title-block {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 25px;
            border-left: 4px solid #00f2ff;
            backdrop-filter: blur(5px);
            border-radius: 0 10px 10px 0;
        }

        h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2ff;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        h2 {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #ccc;
            font-weight: 300;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 4px;
        }

        .brand-credit {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: right;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #ffffff;
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .brand-credit span {
            display: block;
            font-size: 10px;
            color: #888;
            margin-bottom: 2px;
        }

        /* Lil-GUI adjustments */
        .lil-gui {
            --background-color: rgba(10, 15, 20, 0.85);
            --text-color: #eee;
            --title-background-color: #004d66;
            --widget-color: #333;
            --hover-color: #444;
            --focus-color: #555;
            --number-color: #00f2ff;
            --string-color: #00f2ff;
            font-family: 'Roboto Mono', monospace !important;
            z-index: 1000 !important;
            /* Ensure controls are on top */
            pointer-events: auto !important;
            /* Ensure controls are clickable */
        }

        /* Keyframes for the pulse effect */
        @keyframes pulse-blue {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.4);
                border-color: rgba(0, 242, 255, 0.3);
            }

            70% {
                box-shadow: 0 0 10px 0 rgba(0, 242, 255, 0);
                border-color: rgba(0, 242, 255, 0.8);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 242, 255, 0);
                border-color: rgba(0, 242, 255, 0.3);
            }
        }

        /* Ensure specificity beats #ui-layer * */
        #ui-layer .wiki-link {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            color: #00f2ff;
            text-decoration: none;
            text-transform: uppercase;
            border: 1px solid rgba(0, 242, 255, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
            pointer-events: auto !important;
            /* enable click */
            transition: all 0.2s ease;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            /* Ensure it has a hit area */
            animation: pulse-blue 2s infinite;
            /* Add the animation */
        }

        #ui-layer .wiki-link:hover {
            background: rgba(0, 242, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
            /* Stronger glow on hover */
            cursor: pointer;
            animation: none;
            /* Stop pulsing on hover so it stays lit */
            border-color: #00f2ff;
        }

        /* Just in case we have orbit controls issues, ensure container is sized */
        #appbody {
            position: absolute;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <!-- Allows three.js Examples to work without building -->
    <script type="importmap">
            { "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/", "mqtt": "./node_modules/mqtt/dist/mqtt.esm.js" } }
        </script>

    <div id="appbody" style="position: absolute; top:0; left:0; width:100%; height:100%;">
        <script type="module" src="./src/reachy_main.js"></script>
    </div>

    <div id="ui-layer">
        <div class="header">
            <div class="title-block">
                <h1>Reachy Mini</h1>
                <h2>Digital Twin Simulation</h2>
                <a href="https://wiki.seeedstudio.com/reachymini_getting_started/" target="_blank" class="wiki-link">
                    Documentation
                </a>
            </div>
        </div>

        <div class="controls-hint">
            Left Click: Orbit &nbsp;|&nbsp; Right Click: Pan &nbsp;|&nbsp; Scroll: Zoom &nbsp;|&nbsp; Ctrl+Click: Drag
        </div>

        <div class="brand-credit">
            <span>Powered by</span>
            Seeed Studio Robotic Lab
        </div>
    </div>
</body>

</html>
